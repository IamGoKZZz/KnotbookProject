{% load static %}
{% include 'header.html' %}
{% block content %}
<hr>

<style>
    /* body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
    } */

    .container {
        width: 50%;
        margin: 50px auto;
        background: #fff;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 20px;
    }

    .form-group {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px; /* Reducing the gap between label and input */
        margin-bottom: 12px;
    }

    label {
        font-weight: bold;
        width: 30%; /* Reduced width to bring input closer */
        text-align: right; /* Align text properly */
        padding-right: 10px; /* Small spacing before input */
    }

    input[type="file"],
    input[type="number"],
    input[type="text"],
    select {
        width: 65%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        width: 100%;
        background-color: #28a745;
        color: white;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        margin-top: 10px;
    }

    button:hover {
        background-color: #218838;
    }
    .btn-container {
            text-align: center;
            margin-top: 20px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            text-decoration: none;
            cursor: pointer;
            border-radius: 5px;
            display: inline-block;
        }
        .btn:hover {
            background-color: #4171a4;
        }
</style>

<div class="container">
    <h1>Generate a New MCQ Test</h1><br>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label for="file">Upload File:</label>
            <input type="file" name="file" id="file" required>
        </div>

        <div class="form-group">
            <label for="start_page">Start Page:</label>
            <input type="number" name="start_page" id="start_page" value="1" min="1" required>
        </div>

        <div class="form-group">
            <label for="num_questions">No. of Questions:</label>
            <input type="number" name="num_questions" id="num_questions" value="5" min="1" required>
        </div>

        <div class="form-group">
            <label for="title">Title:</label>
            <input type="text" name="title" id="title" required>
        </div>

        <div class="form-group">
            <label for="question_type">Question Type:</label>
            <select name="question_type" id="question_type" required>
                <option value="mcq">MCQ</option>
                <option value="subjective">Subjective</option>
            </select>
        </div>

        <button type="submit">Generate Test</button>
    </form>
    <div class="btn-container">
        <a href="/test/" class="btn">Back to Home</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    document.querySelector("form").addEventListener("submit", function (e) {
        e.preventDefault();  // Prevent default form submission

        // Show processing alert
        Swal.fire({
            title: 'Generating Questions...',
            text: 'Please wait while we generate the MCQ test.',
            allowOutsideClick: false,
            didOpen: () => {
                Swal.showLoading(); // Show loading spinner
            }
        });

        // Disable submit button
        document.querySelector("button[type='submit']").disabled = true;

        // Submit form after a short delay (simulating processing)
        setTimeout(() => {
            e.target.submit();  // Submit the form
        }, 500);  // Adjust timing as needed
    });

    // Show success alert if redirected with success message
    const params = new URLSearchParams(window.location.search);
    if (params.get("success") === "true") {
        Swal.fire({
            icon: 'success',
            title: 'MCQ Test Generated Successfully!',
            text: 'Your MCQ test has been created.',
            confirmButtonText: 'OK'
        });
    }
</script>


{% endblock %}
{% include 'footer.html' %}
